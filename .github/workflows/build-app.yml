name: Build & Package App

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  NODE_VERSION: '20'
  RUST_BACKTRACE: 1

jobs:
  # ────────────────────────────────────────────────────────────────
  # Build native Rust modules for all platforms
  # ────────────────────────────────────────────────────────────────
  build-native:
    name: Build Rust Native Module
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rust-core.win32-x64-msvc.node
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: rust-core.darwin-x64.node
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: rust-core.darwin-arm64.node
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rust-core.linux-x64-gnu.node

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Build native module
        working-directory: native
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          if [ ! -f "native/rust-core.node" ]; then
            echo "Error: rust-core.node not found!"
            ls -la native/
            exit 1
          fi

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.target }}
          path: native/rust-core.node
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Build & Package for Windows
  # ────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows Packages
    needs: build-native
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Download Windows native module
        uses: actions/download-artifact@v4
        with:
          name: native-windows-latest-x86_64-pc-windows-msvc
          path: native

      - name: Install dependencies
        run: npm ci

      - name: Build renderer & main processes
        run: npm run build

      - name: Build packages (Windows NSIS + Portable)
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*.exe
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Build & Package for macOS
  # ────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS Packages
    needs: build-native
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Download x64 native module
        uses: actions/download-artifact@v4
        with:
          name: native-macos-latest-x86_64-apple-darwin
          path: native

      - name: Download arm64 native module
        uses: actions/download-artifact@v4
        with:
          name: native-macos-latest-aarch64-apple-darwin
          path: native/arm64

      - name: Prepare arm64 binary
        run: |
          mkdir -p native/arch-binaries
          cp native/rust-core.node native/arch-binaries/rust-core.darwin-x64.node
          cp native/arm64/rust-core.node native/arch-binaries/rust-core.darwin-arm64.node

      - name: Install dependencies
        run: npm ci

      - name: Build renderer & main processes
        run: npm run build

      - name: Build packages (macOS DMG + ZIP)
        run: npm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Build & Package for Linux
  # ────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux Packages
    needs: build-native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Download Linux native module
        uses: actions/download-artifact@v4
        with:
          name: native-ubuntu-latest-x86_64-unknown-linux-gnu
          path: native

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libxss1

      - name: Install dependencies
        run: npm ci

      - name: Build renderer & main processes
        run: npm run build

      - name: Build packages (Linux AppImage + DEB)
        run: npm run dist:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Create GitHub Release with all artifacts
  # ────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} release-files/ \;
          ls -lah release-files/

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Get release notes
        id: release_notes
        run: |
          if [ -f CHANGELOG.md ]; then
            VERSION=${{ steps.version.outputs.version }}
            sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | head -n -1 | tail -n +2 > release_notes.txt
            cat release_notes.txt
          else
            echo "Release ${{ steps.version.outputs.version }}" > release_notes.txt
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release-files/*
          body_path: release_notes.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Manual Release
        uses: softprops/action-gh-release@v1
        if: github.event.inputs.publish == 'true' && !startsWith(github.ref, 'refs/tags/v')
        with:
          files: release-files/*
          body_path: release_notes.txt
          draft: true
          tag_name: v${{ steps.version.outputs.version }}-manual-${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to releases page
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release-files/
          retention-days: 30

  # ────────────────────────────────────────────────────────────────
  # Final validation
  # ────────────────────────────────────────────────────────────────
  validate:
    name: Validate Builds
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-windows.result }}" == "failure" ] || \
             [ "${{ needs.build-macos.result }}" == "failure" ] || \
             [ "${{ needs.build-linux.result }}" == "failure" ]; then
            echo "❌ One or more builds failed"
            exit 1
          fi
          echo "✅ All builds completed successfully"

      - name: Download all artifacts for summary
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Generate summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Windows" >> $GITHUB_STEP_SUMMARY
          find all-artifacts/dist-windows -type f -exec basename {} \; 2>/dev/null | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY || echo "No Windows artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### macOS" >> $GITHUB_STEP_SUMMARY
          find all-artifacts/dist-macos -type f -exec basename {} \; 2>/dev/null | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY || echo "No macOS artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Linux" >> $GITHUB_STEP_SUMMARY
          find all-artifacts/dist-linux -type f -exec basename {} \; 2>/dev/null | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY || echo "No Linux artifacts" >> $GITHUB_STEP_SUMMARY
