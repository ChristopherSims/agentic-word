name: Build & Package App

permissions:
  contents: write

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  NODE_VERSION: '24'
  RUST_BACKTRACE: 1

jobs:
  # ────────────────────────────────────────────────────────────────
  # Typecheck + tests (Node 24) — release gate evidence
  # ────────────────────────────────────────────────────────────────
  verify:
    name: Typecheck & Tests (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (main, renderer, test contracts)
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

  # ────────────────────────────────────────────────────────────────
  # Build native Rust modules for all platforms
  # ────────────────────────────────────────────────────────────────
  build-native:
    name: Build Rust Native Module
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rust-core.win32-x64-msvc.node
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: rust-core.darwin-x64.node
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: rust-core.darwin-arm64.node
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rust-core.linux-x64-gnu.node

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Install native dependencies
        working-directory: native
        run: npm install

      - name: Build native module
        working-directory: native
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          if [ ! -f "native/rust-core.node" ]; then
            echo "Error: rust-core.node not found!"
            ls -la native/
            exit 1
          fi

      - name: Rename artifact to platform-specific name
        shell: bash
        run: |
          mv native/rust-core.node "native/${{ matrix.artifact }}"
          ls -la native/

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.target }}
          path: native/${{ matrix.artifact }}
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Build & Package for Windows
  # ────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows Packages
    needs: [build-native, verify]
    # Pin to the VS 2022 image: `windows-latest` now ships VS 18 (2026), which
    # node-gyp 11 cannot detect, so native module builds (better-sqlite3) fail.
    runs-on: windows-2022
    env:
      npm_config_msvs_version: '2022'
      GYP_MSVS_VERSION: '2022'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Download Windows native module
        uses: actions/download-artifact@v4
        with:
          name: native-windows-latest-x86_64-pc-windows-msvc
          path: native

      - name: Verify native artifact
        shell: powershell
        run: |
          Write-Host "Contents of native directory:"
          Get-ChildItem -Path native -Recurse -Include "*.node" | ForEach-Object { Write-Host "  $_" }
          
          $sourceFile = "native/rust-core.win32-x64-msvc.node"
          $targetFile = "native/rust-core.node"
          
          if (Test-Path $sourceFile) {
            Write-Host "Found source file, renaming..."
            Move-Item -Path $sourceFile -Destination $targetFile -Force
            Write-Host "Rename successful"
          } else {
            Write-Host "Source file not found. Files in native:"
            Get-ChildItem -Path native -Include "*.node"
          }

      - name: Install dependencies
        run: npm install

      - name: Build renderer & main processes
        run: npm run build

      - name: Build packages (Windows NSIS + Portable)
        shell: bash
        run: npm run dist:win -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package smoke check (ASAR layout + bundled runtime)
        run: node scripts/package-smoke.mjs --resources dist/win-unpacked/resources

      - name: Packaged Electron smoke (real IPC round-trips)
        run: node scripts/electron-smoke.mjs --soft
        timeout-minutes: 5

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*.exe
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Build & Package for macOS
  # ────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS Packages
    needs: [build-native, verify]
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Download x64 native module
        uses: actions/download-artifact@v4
        with:
          name: native-macos-latest-x86_64-apple-darwin
          path: native/x64

      - name: Download arm64 native module
        uses: actions/download-artifact@v4
        with:
          name: native-macos-latest-aarch64-apple-darwin
          path: native/arm64

      - name: Prepare native binaries
        run: |
          mkdir -p native/arch-binaries
          if [ -f "native/x64/rust-core.darwin-x64.node" ]; then
            cp native/x64/rust-core.darwin-x64.node native/arch-binaries/
          fi
          if [ -f "native/arm64/rust-core.darwin-arm64.node" ]; then
            cp native/arm64/rust-core.darwin-arm64.node native/arch-binaries/
          fi
          ls -la native/arch-binaries/

      - name: Install dependencies
        run: npm install

      - name: Build renderer & main processes
        run: npm run build

      - name: Build packages (macOS DMG + ZIP)
        shell: bash
        run: npm run dist:mac -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Build & Package for Linux
  # ────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux Packages
    needs: [build-native, verify]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Download Linux native module
        uses: actions/download-artifact@v4
        with:
          name: native-ubuntu-latest-x86_64-unknown-linux-gnu
          path: native

      - name: Verify native artifact
        shell: bash
        run: |
          if [ -f "native/rust-core.linux-x64-gnu.node" ]; then
            mv native/rust-core.linux-x64-gnu.node native/rust-core.node
          fi
          ls -la native/ | grep -E "\.node$"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libxss1

      - name: Install dependencies
        run: npm install

      - name: Build renderer & main processes
        run: npm run build

      - name: Build packages (Linux AppImage + DEB)
        shell: bash
        run: npm run dist:linux -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Final validation
  # ────────────────────────────────────────────────────────────────
  validate:
    name: Validate Builds
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-windows.result }}" == "failure" ] || \
             [ "${{ needs.build-macos.result }}" == "failure" ] || \
             [ "${{ needs.build-linux.result }}" == "failure" ]; then
            echo " One or more builds failed"
            exit 1
          fi
          echo "All builds completed successfully"

      - name: Download all artifacts for summary
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Generate summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Windows" >> $GITHUB_STEP_SUMMARY
          find all-artifacts/dist-windows -type f -exec basename {} \; 2>/dev/null | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY || echo "No Windows artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### macOS" >> $GITHUB_STEP_SUMMARY
          find all-artifacts/dist-macos -type f -exec basename {} \; 2>/dev/null | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY || echo "No macOS artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Linux" >> $GITHUB_STEP_SUMMARY
          find all-artifacts/dist-linux -type f -exec basename {} \; 2>/dev/null | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY || echo "No Linux artifacts" >> $GITHUB_STEP_SUMMARY
