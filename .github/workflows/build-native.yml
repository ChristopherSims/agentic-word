name: Build Native Rust Addon

on:
  push:
    branches: [master, main]
    paths:
      - 'native/**'
      - '.github/workflows/build-native.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'native/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rust-core.win32-x64-msvc.node
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: rust-core.darwin-x64.node
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: rust-core.darwin-arm64.node
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rust-core.linux-x64-gnu.node

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross-compilation deps (Linux → musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build native addon
        working-directory: native
        run: |
          cargo build --release --target ${{ matrix.target }}
          # napi build requires the .node file naming convention
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rust_core.dll dist/${{ matrix.artifact }} 2>/dev/null || \
          cp target/${{ matrix.target }}/release/librust_core.dylib dist/${{ matrix.artifact }} 2>/dev/null || \
          cp target/${{ matrix.target }}/release/librust_core.so dist/${{ matrix.artifact }} 2>/dev/null || \
          echo "Warning: could not find built .so/.dylib/.dll — may need napi build command"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-core-${{ matrix.target }}
          path: native/dist/${{ matrix.artifact }}
          if-no-files-found: warn

  # Optional: combine all artifacts into a single release asset
  combine:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-artifacts

      - name: Display structure
        run: ls -R native-artifacts

      - name: Create combined release artifact
        run: |
          mkdir -p release
          find native-artifacts -name '*.node' -exec cp {} release/ \;
          ls -la release/
