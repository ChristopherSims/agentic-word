[package]
name = "rust-core"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi4", "serde-json", "tokio_rt"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "vtab"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rayon = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

# Phase 3: storage module
scraper = "0.20"
pulldown-cmark = "0.12"
image = "0.25"
zstd = "0.13"
similar = "2"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
lru = "0.12"
html-escape = "0.2"
base64 = "0.22"
tempfile = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
